# Cyberwave for Midnight Commander
# Derived from the shared Cyberwave terminal palette.

[skin]
    description = Cyberwave
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Background = #000000
    Foreground = #e0e0e0
    Muted = #424242
    Pink = #db5ca6
    Cyan = #5ad0d4
    Lavender = #e09abe
    Periwinkle = #7b80f7
    Magenta = #c743cf
    Sky = #51bde6
    White = #ffffff
    Dialog = #11111c
    Shadow = #08080d

[core]
    _default_ = Foreground;Background
    selected = #000000;Periwinkle
    marked = Lavender;;bold
    markselect = #000000;Lavender;bold
    gauge = #000000;Magenta
    input = Foreground;Muted
    inputunchanged = Lavender;Muted
    inputmark = #000000;Cyan
    disabled = Muted;Dialog
    reverse = #000000;Cyan
    commandlinemark = #000000;Cyan
    header = Cyan
    shadow = Background;Shadow

[dialog]
    _default_ = Foreground;Dialog
    dfocus = #000000;Periwinkle
    dhotnormal = Cyan;;underline
    dhotfocus = #000000;Periwinkle;underline
    dtitle = Pink;;bold

[error]
    _default_ = White;Pink
    errdfocus = #000000;Lavender
    errdhotnormal = White;;underline
    errdhotfocus = #000000;Lavender;underline
    errdtitle = White;;bold

[filehighlight]
    directory = Cyan
    executable = Pink
    symlink = Sky
    hardlink =
    stalelink = Pink
    device = Lavender
    special = Magenta
    core = Pink
    temp = Muted
    archive = Magenta
    doc = Lavender
    source = Sky
    media = Cyan
    graph = Periwinkle
    database = Pink

[menu]
    _default_ = #000000;Cyan
    menusel = #000000;Periwinkle
    menuhot = #000000;Lavender;underline
    menuhotsel = #000000;White;underline
    menuinactive = Muted;Cyan

[popupmenu]
    _default_ = Foreground;Dialog
    menusel = #000000;Periwinkle
    menutitle = Pink;;bold

[buttonbar]
    hotkey = #000000;Pink
    button = #000000;Cyan

[statusbar]
    _default_ = #000000;Sky

[help]
    _default_ = Foreground;Dialog
    helpbold = Pink;;bold
    helpitalic = Lavender;;italic
    helplink = Cyan;;underline
    helpslink = #000000;Cyan
    helptitle = Pink;;bold

[editor]
    _default_ = Foreground;Background
    editbold = Pink;;bold
    editmarked = #000000;Periwinkle
    editwhitespace = Muted
    editnonprintable = Muted
    editlinestate = #000000;Sky
    bookmark = #000000;Pink
    bookmarkfound = #000000;Cyan
    editrightmargin = Muted
    editbg = ;Background
    editframe = Sky
    editframeactive = Pink
    editframedrag = Lavender

[viewer]
    _default_ = Foreground;Background
    viewbold = Pink;;bold
    viewunderline = Cyan;;underline
    viewselected = #000000;Periwinkle

[diffviewer]
    added = ;Cyan
    changedline = ;Lavender
    changednew = ;Sky
    changed = ;Lavender
    removed = ;Pink
    error = White;Pink

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
