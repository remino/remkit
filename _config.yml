title: remkit
description: Personal scripts, customizations, notes, and utilities
baseurl: /remkit
domain: remino.github.io
url: https://remino.github.io

defaults:
  - scope:
      type: pages
    values:
      layout: default

exclude:
  - LICENSE.txt
  - bin
  - bookmarklets/*.js
  - jxa
  - karabiner
  - node_modules
  - userscripts
  - userstyles
  - '*.src.html'

include:
  - .htaccess

sass:
  style: compressed
