# Redirect snippets for nginx.
#
# Common status codes:
#
# 301 Moved Permanently
#   Permanent redirect. Use when the old URL has been replaced for good.
#
# 302 Found
#   Temporary redirect. Use when the old URL may come back.
#
# 303 See Other
#   Redirect using GET. Useful after POST/PUT actions, such as form submissions.
#
# 307 Temporary Redirect
#   Temporary redirect that preserves the original HTTP method and body.
#   Useful for APIs.
#
# 308 Permanent Redirect
#   Permanent redirect that preserves the original HTTP method and body.
#   Useful for APIs.
#
# For normal webpages:
#   permanent move  -> 301
#   temporary move  -> 302
#
# For APIs or non-GET requests:
#   permanent move  -> 308
#   temporary move  -> 307


# -------------------------------------------------------------------
# Simple exact redirects with `return`
# -------------------------------------------------------------------

location = /foo {
	# Simple permanent redirect.
	#
	# `return` immediately finalises the request with a redirect response.
	# This is usually the clearest form for simple redirects.
	return 301 /bar/;
}

location = /foo-temporary {
	# Simple temporary redirect.
	#
	# Use this when the old URL may be used again later.
	return 302 /bar/;
}

location = /foo-see-other {
	# Redirect with 303 See Other.
	#
	# This tells the client to request the new URL with GET.
	# Commonly useful after form submissions or other non-GET actions.
	return 303 /bar/;
}

location = /foo-temporary-preserve-method {
	# Temporary redirect that preserves the original HTTP method and body.
	#
	# Example: POST /foo-temporary-preserve-method stays POST on /bar/.
	return 307 /bar/;
}

location = /foo-permanent-preserve-method {
	# Permanent redirect that preserves the original HTTP method and body.
	#
	# Example: POST /foo-permanent-preserve-method stays POST on /bar/.
	return 308 /bar/;
}


# -------------------------------------------------------------------
# Exact redirects with extra headers
# -------------------------------------------------------------------

location = /foo-with-header {
	# `add_header ... always` makes the header apply even to redirect responses.
	#
	# Without `always`, nginx only adds headers to certain response codes.
	add_header X-Robots-Tag "noindex" always;

	return 301 /bar/;
}


# -------------------------------------------------------------------
# Regex-based redirects with `rewrite`
# -------------------------------------------------------------------

location = /foo-rewrite-temporary {
	# Regex-based temporary redirect.
	#
	# `redirect` means 302.
	# If this rewrite matches, nginx finalises the request with a redirect response.
	rewrite ^ /bar/ redirect;
}

location = /foo-rewrite-permanent {
	# Regex-based permanent redirect.
	#
	# `permanent` means 301.
	# If this rewrite matches, nginx finalises the request with a redirect response.
	rewrite ^ /bar/ permanent;
}


# -------------------------------------------------------------------
# Preserve the rest of the path
# -------------------------------------------------------------------

location /foo/ {
	# Permanent redirect that preserves the rest of the path.
	#
	# /foo/baz     -> /bar/baz
	# /foo/a/b/c   -> /bar/a/b/c
	rewrite ^/foo/(.*)$ /bar/$1 permanent;
}

location /foo-temp/ {
	# Temporary redirect that preserves the rest of the path.
	#
	# /foo-temp/baz     -> /bar/baz
	# /foo-temp/a/b/c   -> /bar/a/b/c
	rewrite ^/foo-temp/(.*)$ /bar/$1 redirect;
}


# -------------------------------------------------------------------
# Prefer `return` when captures are not needed
# -------------------------------------------------------------------

# Good:
#
# location = /old-page {
# 	return 301 /new-page/;
# }

# Better than using rewrite for the same thing:
#
# location = /old-page {
# 	rewrite ^ /new-page/ permanent;
# }


# -------------------------------------------------------------------
# Notes
# -------------------------------------------------------------------

# `return 301 /bar/;`
#   Simple, direct, usually preferred.
#
# `rewrite ^/foo/(.*)$ /bar/$1 permanent;`
#   Useful when you need regex captures.
#
# `permanent`
#   nginx rewrite flag for 301.
#
# `redirect`
#   nginx rewrite flag for 302.
#
# `return 307 ...;` and `return 308 ...;`
#   Use these directly. The rewrite flags only cover 301 and 302.
